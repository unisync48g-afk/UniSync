<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniSync — Class Collaboration</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235b8cff'/><text x='50' y='68' font-size='58' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>U</text></svg>">
<style>
:root{
  --bg:#0e1116; --panel:#151922; --panel2:#1b202b; --line:#262c38;
  --txt:#e6eaf2; --muted:#8b95a7; --accent:#5b8cff; --accent2:#8b5cf6;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-size:14px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3342;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.layout{display:flex;min-height:100vh}
.sidebar{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand .logo{width:32px;height:32px;border-radius:9px;flex:0 0 32px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
.brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.nav{padding:10px 8px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  color:var(--muted);cursor:pointer;margin-bottom:2px;font-weight:500;user-select:none;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--panel2);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(91,140,255,.18),rgba(139,92,246,.10));color:#fff}
.nav-item .ico{width:18px;text-align:center;font-size:15px;flex:0 0 18px}
.nav-sep{padding:14px 14px 6px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#5b6478;font-weight:700}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;border-bottom:1px solid var(--line);background:rgba(14,17,22,.86);
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:20}
.topbar .class-chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:12px;color:var(--muted);white-space:nowrap}
.topbar .class-chip b{color:var(--txt);font-weight:600}
.searchbox{flex:1;max-width:420px;position:relative}
.searchbox input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px 8px 34px;color:var(--txt);outline:none}
.searchbox input:focus{border-color:var(--accent)}
.searchbox .si{position:absolute;left:11px;top:8px;color:var(--muted);font-size:13px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{background:var(--panel2);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;
  color:var(--txt);cursor:pointer;position:relative;display:grid;place-items:center;font-size:15px}
.icon-btn:hover{border-color:#39415a}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;font-weight:700}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;cursor:pointer;flex:0 0 36px}
.content{padding:22px;max-width:1220px;width:100%;margin:0 auto;flex:1}

.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{margin:0 0 3px;font-size:20px;font-weight:650;letter-spacing:-.2px}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 14px;
  border-radius:9px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:7px;transition:.12s;white-space:nowrap}
.btn:hover{border-color:#3a4256;background:#20263540}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#ffb4b4;border-color:#4a2530}
.btn.danger:hover{background:#2a1519}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--txt);background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.empty{text-align:center;padding:44px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:#12161d}
.empty .big{font-size:30px;display:block;margin-bottom:8px;opacity:.6}
.divider{height:1px;background:var(--line);margin:14px 0}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.blue{background:rgba(91,140,255,.14);border-color:rgba(91,140,255,.35);color:#9dbaff}
.tag.green{background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.3);color:#7ee2a4}
.tag.amber{background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.32);color:#f7c76a}
.tag.red{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.32);color:#ff9d9d}
.tag.purple{background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.35);color:#c3adff}
.tag.admin{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:#f7c76a}

label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:550}
label.f > span .req{color:var(--danger)}
.inp,select.inp,textarea.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;color:var(--txt);outline:none;transition:.12s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.12)}
textarea.inp{resize:vertical;min-height:82px}
select.inp{cursor:pointer}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.frow{grid-template-columns:1fr}}
.err{color:#ff9d9d;font-size:12px;margin-top:5px}

.overlay{position:fixed;inset:0;background:rgba(6,8,12,.72);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:620px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15.5px;font-weight:620}
.modal-head .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.modal-body{padding:18px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:11px;
  z-index:200;box-shadow:0 12px 32px rgba(0,0,0,.5);font-weight:550;animation:pop .18s}
.toast.ok{border-color:rgba(34,197,94,.45)}
.toast.err{border-color:rgba(239,68,68,.45)}

.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(900px 500px at 20% 0%,rgba(91,140,255,.14),transparent 60%),
             radial-gradient(700px 500px at 90% 100%,rgba(139,92,246,.13),transparent 60%)}
.auth{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;
  box-shadow:0 24px 70px rgba(0,0,0,.5)}
.auth h1{margin:0 0 4px;font-size:22px;font-weight:680;letter-spacing:-.3px}
.auth p.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.tabs button{flex:1;background:none;border:none;padding:8px 4px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:600;font-size:12.5px}
.tabs button.active{background:var(--accent);color:#fff}
.demo-box{margin-top:16px;padding:12px;border-radius:10px;background:#12161d;border:1px dashed var(--line);font-size:12px;color:var(--muted)}
.demo-box code{background:#1d2230;padding:1px 5px;border-radius:5px;color:#9dbaff}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .n{font-size:24px;font-weight:700;letter-spacing:-.5px}
.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;
  background:var(--panel2);border:1px solid transparent;transition:.12s}
.list-item:hover{border-color:var(--line)}
.list-item .lead{flex:1;min-width:0}
.list-item .t{font-weight:580;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotc{width:9px;height:9px;border-radius:50%;flex:0 0 9px}

.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-head div{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{min-height:92px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px;
  cursor:pointer;transition:.12s;overflow:hidden}
.cal-cell:hover{border-color:#39415a}
.cal-cell.blank{background:transparent;border-color:transparent;cursor:default}
.cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(91,140,255,.35)}
.cal-cell .dn{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.cal-cell.today .dn{color:var(--accent)}
.cal-ev{font-size:10.5px;padding:2px 5px;border-radius:5px;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
@media(max-width:760px){.cal-cell{min-height:64px;padding:5px}.cal-ev{font-size:9px}}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:10px 12px;color:var(--muted);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.6px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#12161d}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}

.stars span{cursor:pointer;color:#4a5266;font-size:15px;transition:.1s}
.stars span.on{color:#f5b942}
.stars span:hover{transform:scale(1.12)}

.member-box{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px;background:var(--panel2)}
.member-box .mb-head{display:flex;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:600}

@media(max-width:900px){
  .layout{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .brand{border-bottom:none;border-right:1px solid var(--line);padding:12px 14px}
  .brand h1,.brand small{display:none}
  .nav{display:flex;padding:8px;gap:4px;flex:1}
  .nav-sep{display:none}
  .nav-item{white-space:nowrap;margin:0;padding:8px 11px}
  .nav-item .lbl{display:none}
  .nav-item .ico{font-size:17px}
  .content{padding:16px}
}

.file-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.14s}
.file-card:hover{border-color:#3a4256;transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.28)}
.file-icon{width:48px;height:58px;flex:0 0 48px;border-radius:8px;position:relative;
  background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:11px;letter-spacing:.4px;box-shadow:0 4px 12px rgba(239,68,68,.28)}
.file-icon::after{content:'';position:absolute;top:0;right:0;width:14px;height:14px;
  background:linear-gradient(225deg,rgba(255,255,255,.55) 50%,transparent 50%);border-bottom-left-radius:6px}
.file-icon svg{width:20px;height:20px;stroke-width:2.2}
.file-body{flex:1;min-width:0}
.file-name{font-weight:600;font-size:14px;color:var(--txt);margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:11.5px;color:var(--muted)}
.file-open{color:var(--accent);font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}

.group-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  display:flex;flex-direction:column;gap:12px;transition:.14s}
.group-card:hover{border-color:#3a4256}
.group-head{display:flex;align-items:center;gap:12px}
.platform-badge{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;
  color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.platform-badge svg{width:22px;height:22px}
.group-name{font-weight:620;font-size:14.5px;margin-bottom:3px}
.group-desc{font-size:12.5px;color:var(--muted);line-height:1.45}
.group-foot{display:flex;align-items:center;gap:8px;padding-top:4px}
.open-link{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;
  color:#fff;font-weight:600;font-size:12.5px;text-decoration:none;transition:.12s;border:none;cursor:pointer}
.open-link:hover{filter:brightness(1.08);transform:translateY(-1px)}
</style>
</head>
<body>
<div id="app">
  <div style="display:grid;place-items:center;min-height:100vh">
    <div style="text-align:center">
      <div style="font-size:32px;margin-bottom:12px">⏳</div>
      <div class="muted">Loading UniSync…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  other: { name:'Other', color:'#8b95a7',
    svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>' }
};
const PDF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

const $  = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => (n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const colorFor = s => {
  let h = 0; for (let i=0;i<String(s).length;i++) h = String(s).charCodeAt(i) + ((h<<5)-h);
  return `hsl(${Math.abs(h)%360},58%,48%)`;
};
const iso = (off=0) => { const d=new Date(); d.setDate(d.getDate()+off); return d.toISOString().slice(0,10); };
const fmtDate = ds => { if(!ds) return '—'; const d = new Date(ds + (ds.length===10 ? 'T00:00:00' : '')); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); };
const fmtDateTime = ds => { if(!ds) return '—'; return new Date(ds).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
const daysUntil = ds => Math.ceil((new Date(ds+'T00:00:00') - new Date(new Date().toDateString()))/86400000);
const countdown = ds => {
  const d = daysUntil(ds);
  if (d < 0) return { text:`${-d}d overdue`, cls:'red' };
  if (d === 0) return { text:'Today', cls:'red' };
  if (d === 1) return { text:'Tomorrow', cls:'amber' };
  if (d <= 7) return { text:`${d} days`, cls:'amber' };
  return { text:`${d} days`, cls:'' };
};
const sortByDate = (a,b) => (a.date+a.start_time).localeCompare(b.date+b.start_time);
const isDrivePdf = r => r && r.type === 'PDF (Drive)';
const isAdmin = u => u && u.role === 'admin';
const isCR = u => u && u.role === 'cr';
const canManage = u => isAdmin(u) || isCR(u);

};

let toastTimer = null;
let channels = [];
let memberDraft = [];

async function fetchAll(){
  const [p, r, n, a, e, g, pr, s, nt, ci] = await Promise.all([
    sb.from('profiles').select('*').order('name'),
    sb.from('resources').select('*').order('uploaded_at', {ascending:false}),
    sb.from('notices').select('*').order('created_at', {ascending:false}),
    sb.from('notice_acks').select('*'),
    sb.from('events').select('*').order('date'),
    sb.from('groups').select('*').order('created_at', {ascending:false}),
    sb.from('presentations').select('*').order('created_at', {ascending:false}),
    sb.from('submissions').select('*').order('submitted_at', {ascending:false}),
    sb.from('notifications').select('*').order('created_at', {ascending:false}),
    sb.from('class_info').select('*').eq('id', 1).maybeSingle()
  ]);
  if (p.data) DB.profiles = p.data;
  if (r.data) DB.resources = r.data;
  if (n.data) DB.notices = n.data;
  if (a.data) DB.notice_acks = a.data;
  if (e.data) DB.events = e.data;
  if (g.data) DB.groups = g.data;
  if (pr.data) DB.presentations = pr.data;
  if (s.data) DB.submissions = s.data;
  if (nt.data) DB.notifications = nt.data;
  if (ci.data) DB.class_info = ci.data;
  if (!DB.class_info) DB.class_info = { name:'UniSync', dept:'CSE', batch:'—', section:'—', semester:'—' };
}

function subscribeRealtime(){
  channels.forEach(c => sb.removeChannel(c));
  channels = [];
  const tables = ['profiles','resources','notices','notice_acks','events','groups','presentations','submissions','notifications','class_info'];
  tables.forEach(table => {
    const ch = sb.channel(`rt_${table}`)
      .on('postgres_changes', { event:'*', schema:'public', table }, async () => {
        await fetchAll();
        render();
      })
      .subscribe();
    channels.push(ch);
  });
}

function toast(msg, type='ok'){
  S.toast = { msg, type };
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; render(); }, 2800);
}
function openModal(type, props={}){ S.modal = { type, ...props }; render(); }
function closeModal(){ S.modal = null; render(); }
function go(route){ S.route = route; S.modal = null; window.scrollTo(0,0); render(); }

async function notify(userIds, title, body, link){
  const ids = Array.isArray(userIds) ? userIds : [userIds];
  const rows = ids.filter(Boolean).map(uid => ({ user_id: uid, title, body, link: link||'' }));
  if (!rows.length) return;
  await sb.from('notifications').insert(rows);
}
async function notifyClass(exceptId, title, body, link){
  const ids = DB.profiles.filter(p => p.id !== exceptId).map(p => p.id);
  await notify(ids, title, body, link);
}

function setAuthTab(t){ S.authTab = t; S.authError = ''; render(); }
function toggleAuthMode(){ S.authMode = S.authMode === 'login' ? 'register' : 'login'; S.authError = ''; render(); }

async function doAuth(){
  const email = ($('#li_email')?.value || '').trim();
  const pw = ($('#li_pw')?.value || '');
  if (!email || !pw){ S.authError = 'Email and password are required.'; render(); return; }
  if (S.authMode === 'register'){
    const name = ($('#li_name')?.value || '').trim();
    const sid = ($('#li_sid')?.value || '').trim();
    if (!name || !sid){ S.authError = 'Name and Student ID are required.'; render(); return; }
    if (pw.length < 6){ S.authError = 'Password must be at least 6 characters.'; render(); return; }
    const { error } = await sb.auth.signUp({
      email, password: pw,
      options: { data: { name, student_id: sid } }
    });
    if (error){ S.authError = error.message; render(); return; }
    toast('Account created! You can now sign in.');
    S.authMode = 'login'; S.authError = ''; render();
    return;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error){ S.authError = error.message; render(); return; }
  S.authError = '';
}

async function logout(){
  channels.forEach(c => sb.removeChannel(c));
  channels = [];
  await sb.auth.signOut();
  S.user = null; S.profile = null; S.route = 'dashboard';
  render();
}

function unreadCount(){
  if (!S.profile) return 0;
  return DB.notifications.filter(n => n.user_id === S.profile.id && !n.read).length;
}

function viewSidebar(u){
  const sections = ['Main','Class','Admin'];
  let html = `<aside class="sidebar">
    <div class="brand">
      <div class="logo">US</div>
      <div><h1>UniSync</h1><small>${esc(DB.class_info.name)}</small></div>
    </div>
    <nav class="nav">`;
  sections.forEach(sec => {
    const items = NAV.filter(n => {
      if (n.section !== sec) return false;
      if (n.adminOnly) return isAdmin(u);
      return true;
    });
    if (!items.length) return;
    html += `<div class="nav-sep">${sec}</div>`;
    items.forEach(n => {
      html += `<button class="nav-item ${S.route===n.id?'active':''}" onclick="go('${n.id}')" title="${n.label}">
        <span class="ico">${n.ico}</span><span class="lbl">${n.label}</span>
      </button>`;
    });
  });
  html += `</nav></aside>`;
  return html;
}

function render(){
  const app = document.getElementById('app');

  if (S.loading){
    app.innerHTML = `<div style="display:grid;place-items:center;min-height:100vh">
      <div style="text-align:center"><div style="font-size:32px;margin-bottom:12px">⏳</div><div class="muted">Loading…</div></div>
    </div>`;
    return;
  }

  if (!S.profile){
    app.innerHTML = viewAuth();
    return;
  }

  const u = S.profile;
  const a = document.activeElement;
  let fk=null, ss=null, se=null;
  if (a && a.dataset && a.dataset.fk){ fk = a.dataset.fk; ss = a.selectionStart; se = a.selectionEnd; }

  app.innerHTML = `
    <div class="layout">
      ${viewSidebar(u)}
      <main class="main">
        ${viewTopbar(u)}
        <div class="content">${viewRoute(u)}</div>
      </main>
    </div>
    ${S.modal ? viewModal(u) : ''}
    ${S.toast ? `<div class="toast ${S.toast.type==='err'?'err':'ok'}">${esc(S.toast.msg)}</div>` : ''}
  `;

  if (fk){
    const el = document.querySelector(`[data-fk="${fk}"]`);
    if (el){ el.focus(); try { el.setSelectionRange(ss, se); } catch(e){} }
  }
}

function viewRoute(u){
  switch(S.route){
    case 'dashboard':     return viewDashboard(u);
    case 'resources':     return viewResources(u);
    case 'notices':       return viewNotices(u);
    case 'calendar':      return viewCalendar(u);
    case 'presentations': return viewPresentations(u);
    case 'groups':        return viewGroups(u);
    case 'members':       return viewMembers(u);
    case 'manage-crs':    return isAdmin(u) ? viewManageCRs(u) : viewDashboard(u);
    case 'notifications': return viewNotifications(u);
    case 'search':        return viewSearch(u);
    default:              return viewDashboard(u);
  }
}

function nameOf(id){ const u = DB.profiles.find(x=>x.id===id); return u ? u.name : 'Unknown'; }

function viewDashboard(u){
  const today = iso(0);
  const in7 = iso(7);
  const upcoming = DB.events.filter(e => e.date >= today && e.date <= in7).sort(sortByDate);
  const todays = DB.events.filter(e => e.date === today).sort(sortByDate);
  const notices = DB.notices.filter(n => !n.expires_at || n.expires_at >= today).slice(0,4);
  const recentRes = DB.resources.slice(0,4);
  const mySubs = DB.submissions.filter(s => s.submitted_by === u.id);
  const recentGroups = DB.groups.slice(0,3);

  const stat = (n,l) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;

  let greeting = isAdmin(u) ? 'You are the Administrator. Only you can appoint or remove CRs.'
    : isCR(u) ? 'You are a Class Representative — manage schedules, notices and submissions.'
    : 'Here is what is happening in your class today.';

  let stats;
  if (isAdmin(u)){
    stats = `<div class="grid g4" style="margin-bottom:18px">
      ${stat(DB.profiles.filter(x=>x.role==='student').length,'Students')}
      ${stat(DB.profiles.filter(x=>x.role==='cr').length,'CRs')}
      ${stat(DB.resources.length,'Resources')}
      ${stat(DB.events.filter(e=>e.date>=today).length,'Upcoming events')}
    </div>`;
  } else if (isCR(u)){
    stats = `<div class="grid g4" style="margin-bottom:18px">
      ${stat(DB.profiles.length,'Class members')}
      ${stat(DB.resources.length,'Resources')}
      ${stat(DB.events.filter(e=>e.date>=today).length,'Upcoming events')}
      ${stat(DB.submissions.length,'Submissions')}
    </div>`;
  } else {
    stats = `<div class="grid g4" style="margin-bottom:18px">
      ${stat(todays.length,'Classes today')}
      ${stat(upcoming.filter(e=>['Assignment','Quiz','Exam','Midterm','Final'].includes(e.type)).length,'Deadlines this week')}
      ${stat(notices.length,'Active notices')}
      ${stat(mySubs.length,'My submissions')}
    </div>`;
  }

  const evRow = e => {
    const c = countdown(e.date);
    return `<div class="list-item">
      <div class="dotc" style="background:${EVENT_COLORS[e.type]||'#888'}"></div>
      <div class="lead">
        <div class="t">${esc(e.title)}</div>
        <div class="tiny muted">${fmtDate(e.date)} · ${esc(e.start_time)}–${esc(e.end_time)}${e.location?' · '+esc(e.location):''}</div>
      </div>
      <span class="tag ${c.cls}">${c.text}</span>
    </div>`;
  };

  return `
    <div class="page-head">
      <div><h2>Hello, ${esc(u.name.split(' ')[0])} 👋</h2><p>${greeting}</p></div>
      <div class="actions">
        ${canManage(u) ? `
          <button class="btn" onclick="openModal('event')">+ Event</button>
          <button class="btn" onclick="openModal('notice')">+ Notice</button>
          <button class="btn primary" onclick="openModal('presentation')">+ Presentation</button>
        ` : `<button class="btn primary" onclick="go('presentations')">Submit presentation</button>`}
        ${isAdmin(u) ? `<button class="btn" onclick="go('manage-crs')">Manage CRs</button>` : ''}
      </div>
    </div>

    ${stats}

    <div class="grid g2">
      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <b style="font-size:14.5px">${todays.length ? "Today's schedule" : 'Upcoming this week'}</b>
          <button class="btn ghost sm" style="margin-left:auto" onclick="go('calendar')">View calendar →</button>
        </div>
        <div class="stack">
          ${(todays.length ? todays : upcoming).slice(0,5).map(evRow).join('') || `<div class="empty"><span class="big">🗓</span>Nothing scheduled.</div>`}
        </div>
      </div>

      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <b style="font-size:14.5px">Latest notices</b>
          <button class="btn ghost sm" style="margin-left:auto" onclick="go('notices')">All →</button>
        </div>
        <div class="stack">
          ${notices.map(n => `
            <div class="list-item" onclick="go('notices')" style="cursor:pointer">
              <div class="lead">
                <div class="t">${n.pinned?'📌 ':''}${esc(n.title)}</div>
                <div class="tiny muted">${esc(n.category)} · ${fmtDate(n.created_at?.slice(0,10))}</div>
              </div>
              ${n.priority!=='Normal' ? `<span class="tag ${PRIORITY_TAG[n.priority]}">${n.priority}</span>` : ''}
            </div>`).join('') || `<div class="empty"><span class="big">📢</span>No notices yet.</div>`}
        </div>
      </div>

      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <b style="font-size:14.5px">Recently shared</b>
          <button class="btn ghost sm" style="margin-left:auto" onclick="go('resources')">All →</button>
        </div>
        <div class="stack">
          ${recentRes.map(r => `
            <div class="list-item">
              <div class="lead">
                <div class="t">${esc(r.title)}</div>
                <div class="tiny muted">${esc(r.course||'—')} · ${esc(r.type)}</div>
              </div>
              <button class="btn sm" onclick="openResource('${r.id}')">Open</button>
            </div>`).join('') || `<div class="empty"><span class="big">📚</span>No resources yet.</div>`}
        </div>
      </div>

      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <b style="font-size:14.5px">Class groups</b>
          <button class="btn ghost sm" style="margin-left:auto" onclick="go('groups')">All →</button>

        </div>
      </div>
    </div>
  `;
}

function viewResources(u){
  const f = S.resFilter;
  const courses = [...new Set(DB.resources.map(r=>r.course).filter(Boolean))].sort();
  let list = [...DB.resources];
  if (f.q){
    const q = f.q.toLowerCase();
    list = list.filter(r => [r.title,r.course,r.topic,r.teacher,(r.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));
  }
  if (f.course) list = list.filter(r => r.course === f.course);
  if (f.type) list = list.filter(r => r.type === f.type);

  return `
    <div class="page-head">
      <div><h2>Resources & Notes</h2><p>Shared study materials. Anyone can upload.</p></div>
      <div class="actions"><button class="btn primary" onclick="openModal('resource')">+ Upload resource</button></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="row wrap">
        <input class="inp" style="flex:2;min-width:200px" placeholder="Search…" value="${esc(f.q)}" data-fk="resq"
               oninput="S.resFilter.q=this.value;render()">
        <select class="inp" style="flex:1;min-width:150px" onchange="S.resFilter.course=this.value;render()">
          <option value="">All courses</option>
          ${courses.map(c=>`<option ${f.course===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
        <select class="inp" style="flex:1;min-width:150px" onchange="S.resFilter.type=this.value;render()">
          <option value="">All types</option>
          ${RESOURCE_TYPES.map(t=>`<option ${f.type===t?'selected':''}>${esc(t)}</option>`).join('')}
        </select>
      </div>
    </div>

    ${list.length ? `<div class="grid g2">${list.map(r => resourceCard(r, u)).join('')}</div>`
      : `<div class="empty"><span class="big">📚</span>No resources match.</div>`}
  `;
}

function resourceCard(r, u){
  const canDelete = canManage(u) || r.uploaded_by === u.id;
  if (isDrivePdf(r)){
    const cleanName = (r.title || '').replace(/\.pdf$/i,'');
    return `<div class="card" style="padding:12px">
      <div class="file-card" onclick="openResource('${r.id}')" style="background:var(--panel2)">

    window.open(data.publicUrl, '_blank', 'noopener');
  } else toast('No link attached', 'err');

async function deleteResource(id){

function viewCalendar(u){
  const now = new Date();
  if (S.calYear === null){ S.calYear = now.getFullYear(); S.calMonth = now.getMonth(); }
  const y = S.calYear, m = S.calMonth;
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = iso(0);
  const monthName = new Date(y, m, 1).toLocaleDateString(undefined,{month:'long',year:'numeric'});

  let cells = '';
  for (let i=0;i<firstDow;i++) cells += `<div class="cal-cell blank"></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = DB.events.filter(e=>e.date===ds).sort(sortByDate);
    cells += `<div class="cal-cell ${ds===todayStr?'today':''}" onclick="openModal('day',{date:'${ds}'})">
      <div class="dn">${d}</div>
      ${evs.slice(0,3).map(e=>`<div class="cal-ev" style="background:${(EVENT_COLORS[e.type]||'#888')}22;color:${EVENT_COLORS[e.type]||'#888'};border-left:2px solid ${EVENT_COLORS[e.type]||'#888'}">${esc(e.title)}</div>`).join('')}
    </div>`;
  }

  const upcoming = DB.events.filter(e => e.date >= todayStr).sort(sortByDate).slice(0,8);
  const legend = EVENT_TYPES.map(t=>`<span class="row tiny" style="gap:5px"><span class="dotc" style="background:${EVENT_COLORS[t]}"></span>${t}</span>`).join('');

  return `
    <div class="page-head">
      <div><h2>Class Calendar</h2><p>Routine, exams, deadlines, quizzes and other events.</p></div>
      ${canManage(u) ? `<div class="actions"><button class="btn primary" onclick="openModal('event')">+ Add event</button></div>` : ''}
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="row" style="margin-bottom:14px">
        <button class="btn sm" onclick="calMove(-1)">‹</button>
        <b style="font-size:15px;min-width:170px;text-align:center">${monthName}</b>
        <button class="btn sm" onclick="calMove(1)">›</button>
        <button class="btn ghost sm" onclick="calToday()">Today</button>
        <div class="row wrap" style="margin-left:auto;gap:12px">${legend}</div>
      </div>
      <div class="cal-head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>

    <div class="card">
      <b style="font-size:14.5px">Upcoming events</b>
      <div class="stack" style="margin-top:12px">
        ${upcoming.map(e=>{
          const c = countdown(e.date);
          return `<div class="list-item">
            <div class="dotc" style="background:${EVENT_COLORS[e.type]||'#888'}"></div>
            <div class="lead">
              <div class="t">${esc(e.title)}</div>
              <div class="tiny muted">${fmtDate(e.date)} · ${esc(e.start_time)}–${esc(e.end_time)}${e.location?' · '+esc(e.location):''}</div>
            </div>
            <span class="tag ${c.cls}">${c.text}</span>
            ${canManage(u)?`<button class="icon-btn" style="width:30px;height:30px;font-size:12px" onclick="deleteEvent('${e.id}')">🗑</button>`:''}
          </div>`;
        }).join('') || `<div class="empty"><span class="big">🗓</span>No upcoming events.</div>`}
      </div>
    </div>
  `;
}

function calMove(delta){
  let m = S.calMonth + delta, y = S.calYear;
  if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; }
  S.calMonth = m; S.calYear = y; render();
}
function calToday(){ const n = new Date(); S.calYear = n.getFullYear(); S.calMonth = n.getMonth(); render(); }

async function remindNonSubmitters(pid){
  const p = DB.presentations.find(x=>x.id===pid); if (!p) return;
  const covered = new Set();
  DB.submissions.filter(s=>s.presentation_id===pid).forEach(s=>{
    covered.add(s.leader_id);
    (s.members||[]).forEach(m=>covered.add(String(m.id).trim()));
  });
  const targets = DB.profiles.filter(x=>x.role!=='admin' && !covered.has(x.student_id)).map(x=>x.id);
  if (!targets.length){ toast('Everyone submitted'); return; }
  await notify(targets, 'Presentation reminder', `You haven't submitted for "${p.title}". Deadline: ${fmtDate(p.deadline)}.`, 'presentations');
  toast(`Reminder sent to ${targets.length} student(s)`);
}

function exportSubmissions(pid){
  const p = DB.presentations.find(x=>x.id===pid) || { title:'Presentation', course:'' };
  const subs = DB.submissions.filter(s => s.presentation_id === pid);
  const maxMembers = Math.max(0, ...subs.map(s => (s.members||[]).length));
  const headers = ['Team','Leader Name','Leader ID','Link','Submitted'];
  for (let i=1;i<=maxMembers;i++) headers.push(`Member ${i} Name`, `Member ${i} ID`);
  const rows = subs.map(s => {
    const row = [s.team_name||'', s.leader_name, s.leader_id, s.link, s.submitted_at];
    for (let i=0;i<maxMembers;i++){
      const m = (s.members||[])[i];
      row.push(m ? m.name : '', m ? m.id : '');
    }
    return row;
  });
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `submissions_${p.title.replace(/\W+/g,'_')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('CSV exported');
}

      <table class="tbl">
        <thead><tr><th>Member</th><th>Student ID</th><th>Role</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody>${[...admins, ...crs, ...students].map(rowFor).join('')}</tbody>
      </table>
    </div>
  `;
}

async function appointCR(id){
  if (!confirm('Appoint as Class Representative?')) return;
  await sb.from('profiles').update({ role: 'cr' }).eq('id', id);
  await notify(id, 'You are now a CR', 'You can manage notices, calendar, groups and submissions.', 'dashboard');

}
async function demoteCR(id){
  if (!confirm('Demote back to Student?')) return;
  await sb.from('profiles').update({ role: 'student' }).eq('id', id);
  await notify(id, 'Role changed', 'You are now a Student.', 'dashboard');
  toast('CR demoted');
}

function viewNotifications(u){
  const mine = DB.notifications.filter(n=>n.user_id===u.id);
  return `
    <div class="page-head">
      <div><h2>Notifications</h2><p>${mine.filter(n=>!n.read).length} unread</p></div>
      <div class="actions">
        <button class="btn" onclick="markAllRead()">Mark all read</button>
        <button class="btn danger" onclick="clearNotifications()">Clear all</button>
      </div>
    </div>
    <div class="stack">
      ${mine.map(n => `
        <div class="list-item" style="${n.read?'':'border-color:rgba(91,140,255,.35)'}">
          <div class="dotc" style="background:${n.read?'#3a4256':'var(--accent)'}"></div>
          <div class="lead">
            <div class="t">${esc(n.title)}</div>

async function markAllRead(){
  await sb.from('notifications').update({ read: true }).eq('user_id', S.profile.id).eq('read', false);
}
async function clearNotifications(){
  await sb.from('notifications').delete().eq('user_id', S.profile.id);
  toast('Cleared');
}

function doSearch(q){
  S.search = q;
  if (q.trim() && S.route !== 'search') S.route = 'search';
  if (!q.trim() && S.route === 'search') S.route = 'dashboard';
  render();
}

function viewSearch(u){
  const q = S.search.trim().toLowerCase();
  if (!q) return `<div class="empty"><span class="big">🔍</span>Type something to search.</div>`;
  const res = DB.resources.filter(r => [r.title,r.course,r.topic,r.teacher].join(' ').toLowerCase().includes(q));
  const not = DB.notices.filter(n => (n.title + ' ' + n.body).toLowerCase().includes(q));
  const evs = DB.events.filter(e => [e.title,e.course,e.location,e.type].join(' ').toLowerCase().includes(q));
  const mem = DB.profiles.filter(m => (m.name + ' ' + m.student_id).toLowerCase().includes(q));
  const grs = DB.groups.filter(g => (g.name + ' ' + (g.description||'')).toLowerCase().includes(q));
  const total = res.length + not.length + evs.length + mem.length + grs.length;
  const block = (title, items, renderer) => items.length ? `
    <div class="card" style="margin-bottom:14px">
      <b style="font-size:14px">${title} <span class="muted">(${items.length})</span></b>
      <div class="stack" style="margin-top:10px">${items.map(renderer).join('')}</div>
    </div>` : '';

  return `
    <div class="page-head"><div><h2>Search</h2><p>${total} result${total!==1?'s':''} for "${esc(S.search)}"</p></div></div>
    ${total ? '' : `<div class="empty"><span class="big">🔍</span>Nothing found.</div>`}
    ${block('Resources', res, r => `<div class="list-item"><div class="lead"><div class="t">${esc(r.title)}</div><div class="tiny muted">${esc(r.course||'—')} · ${esc(r.type)}</div></div><button class="btn sm" onclick="openResource('${r.id}')">Open</button></div>`)}
    ${block('Notices', not, n => `<div class="list-item" onclick="go('notices')" style="cursor:pointer"><div class="lead"><div class="t">${esc(n.title)}</div></div></div>`)}
    ${block('Events', evs, e => `<div class="list-item" onclick="go('calendar')" style="cursor:pointer"><div class="dotc" style="background:${EVENT_COLORS[e.type]||'#888'}"></div><div class="lead"><div class="t">${esc(e.title)}</div><div class="tiny muted">${fmtDate(e.date)}</div></div></div>`)}
    ${block('Groups', grs, g => `<a class="list-item" href="${esc(g.link)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div class="lead"><div class="t">${esc(g.name)}</div></div></a>`)}
    ${block('Members', mem, m => `<div class="list-item"><div class="avatar" style="width:28px;height:28px;flex:0 0 28px;border-radius:8px;font-size:11px;background:${colorFor(m.id)}">${esc(initials(m.name))}</div><div class="lead"><div class="t">${esc(m.name)}</div><div class="tiny muted">${esc(m.student_id)}</div></div></div>`)}
  `;
}

function modalShell(title, bodyHtml, footHtml){
  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot">${footHtml}</div>
    </div>
  </div>`;
}

      <label class="f"><span>Title <span class="req">*</span></span>

function addMemberRow(){
  const p = DB.presentations.find(x => x.id === S.modal.presentationId);
  const max = p?.max_team_size || 6;
  if (memberDraft.length >= max - 1){ toast('Team size limit reached', 'err'); return; }
  memberDraft.push({ name:'', id:'' });
  render();
}
function removeMemberRow(i){
  memberDraft.splice(i,1);
  render();
}

async function saveProfile(){
  const name = $('#pf_name').value.trim();
  const email = $('#pf_email').value.trim();
  if (!name){ toast('Name required', 'err'); return; }
  await sb.from('profiles').update({ name, email }).eq('id', S.profile.id);
  toast('Profile updated');
  closeModal();
}

async function saveResource(){
  const title = $('#r_title').value.trim();
  const link = $('#r_link').value.trim();
  const fileInput = $('#r_file');
  const file = fileInput.files && fileInput.files[0];

  if (!title){ toast('Title required', 'err'); return; }
  if (!link && !file){ toast('Provide a link or file', 'err'); return; }

  let filePath = null, fileName = null;
  if (file){
    if (file.size > 5 * 1024 * 1024){ toast('File too large (max 5 MB)', 'err'); return; }
    const path = `${S.profile.id}/${Date.now()}_${file.name}`;
    const { error: upErr } = await sb.storage.from('resources').upload(path, file);
    if (upErr){ toast('Upload failed: ' + upErr.message, 'err'); return; }
    filePath = path; fileName = file.name;
  }

  const { error } = await sb.from('resources').insert({
    title,
    course: $('#r_course').value.trim(),
    type: $('#r_type').value,
    link: link || null,
    file_path: filePath,
    file_name: fileName,
    tags: $('#r_tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    uploaded_by: S.profile.id
  });
  if (error){ toast(error.message, 'err'); return; }
  toast('Resource uploaded');
  closeModal();
}

async function saveNotice(){
  const title = $('#n_title').value.trim();
  const body = $('#n_body').value.trim();
  if (!title || !body){ toast('Title and body required', 'err'); return; }
  const { error } = await sb.from('notices').insert({
    title, body,
    category: $('#n_cat').value,
    priority: $('#n_pri').value,
    expires_at: $('#n_exp').value || null,
    pinned: $('#n_pin').value === 'yes',
    created_by: S.profile.id
  });
  if (error){ toast(error.message, 'err'); return; }
  await notifyClass(S.profile.id, 'New notice', title, 'notices');
  toast('Notice published');
  closeModal();
}

async function saveEvent(){
  const title = $('#e_title').value.trim();
  const date = $('#e_date').value;
  if (!title || !date){ toast('Title and date required', 'err'); return; }
  const { error } = await sb.from('events').insert({
    title, date,
    type: $('#e_type').value,
    course: $('#e_course').value.trim(),
    location: $('#e_loc').value.trim(),
    start_time: $('#e_st').value || '09:00',
    end_time: $('#e_et').value || '10:00',
    description: $('#e_desc').value.trim(),
    created_by: S.profile.id

  await notifyClass(S.profile.id, 'New event scheduled', `${title} — ${fmtDate(date)}`, 'calendar');

async function saveGroup(){
  const name = $('#g_name').value.trim();
  const link = $('#g_link').value.trim();
  if (!name || !link){ toast('Name and link required', 'err'); return; }
  if (!/^https?:\/\//i.test(link)){ toast('Link must start with http:// or https://', 'err'); return; }
  const { error } = await sb.from('groups').insert({
    name, link,
    platform: $('#g_platform').value,
    description: $('#g_desc').value.trim(),
    created_by: S.profile.id
  });
  if (error){ toast(error.message, 'err'); return; }
  await notifyClass(S.profile.id, 'New class group added', name, 'groups');

async function savePresentation(){
  const title = $('#p_title').value.trim();
  const deadline = $('#p_deadline').value;
  if (!title || !deadline){ toast('Title and deadline required', 'err'); return; }
  const { error } = await sb.from('presentations').insert({
    title, deadline,
    course: $('#p_course').value.trim(),
    max_team_size: parseInt($('#p_max').value) || 4,
    instructions: $('#p_instr').value.trim(),
    created_by: S.profile.id
  });
  if (error){ toast(error.message, 'err'); return; }
  await notifyClass(S.profile.id, 'New presentation open', `${title} — deadline ${fmtDate(deadline)}`, 'presentations');
  toast('Presentation created');
  closeModal();
}

async function submitPresentation(pid, existingId){
  const p = DB.presentations.find(x => x.id === pid);
  if (!p){ toast('Presentation not found', 'err'); return; }

  const link = $('#sb_link').value.trim();
  const teamName = $('#sb_team').value.trim();
  const leaderName = $('#sb_ln').value.trim();
  const leaderId = $('#sb_li').value.trim();

  if (!link || !/^https?:\/\/\S+\.\S+/i.test(link)){ toast('Enter a valid URL', 'err'); return; }
  if (!leaderName || !leaderId){ toast('Leader name and ID required', 'err'); return; }

  const members = [];
  const seen = new Set([leaderId]);
  for (let i=0;i<memberDraft.length;i++){
    const nm = (memberDraft[i].name||'').trim();
    const mid = (memberDraft[i].id||'').trim();
    if (!nm && !mid) continue;
    if (!nm || !mid){ toast(`Member ${i+1}: both fields required`, 'err'); return; }
    if (seen.has(mid)){ toast(`Duplicate ID: ${mid}`, 'err'); return; }
    seen.add(mid);
    members.push({ name: nm, id: mid });
  }

  const max = p.max_team_size || 6;
  if (members.length + 1 > max){ toast(`Team size limit is ${max}`, 'err'); return; }

  const payload = {
    presentation_id: pid,
    link, team_name: teamName || null,
    leader_name: leaderName, leader_id: leaderId,
    members,
    submitted_by: S.profile.id,
    updated_at: new Date().toISOString()
  };

  if (existingId){
    const { error } = await sb.from('submissions').update(payload).eq('id', existingId);
    if (error){ toast(error.message, 'err'); return; }
    toast('Submission updated');
  } else {
    payload.submitted_at = new Date().toISOString();
    const { error } = await sb.from('submissions').insert(payload);
    if (error){ toast(error.message, 'err'); return; }
    await notify(DB.profiles.filter(x=>x.role==='cr'||x.role==='admin').map(x=>x.id),
      'New presentation submission', `${leaderName} submitted for "${p.title}".`, 'presentations');
    toast('Submission saved');
  }
  memberDraft = [];
  closeModal();
}

(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    S.user = session.user;
    await loadProfile();
  }
  S.loading = false;

  sb.auth.onAuthStateChange(async (event, session) => {
    if (session){
      S.user = session.user;
      await loadProfile();
    } else {
      S.user = null;
      S.profile = null;
      S.loading = false;
      render();
    }
  });

  if (S.profile){
    await fetchAll();
    subscribeRealtime();
  }
  render();
})();

async function loadProfile(){
  if (!S.user) return;
  for (let i=0; i<5; i++){
    const { data } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
    if (data){
      S.profile = data;
      await fetchAll();
      subscribeRealtime();
      S.loading = false;
      render();
      return;
    }
    await new Promise(r => setTimeout(r, 500));
  }
  const meta = S.user.user_metadata || {};
  const { data, error } = await sb.from('profiles').insert({
    id: S.user.id,
    name: meta.name || 'New User',
    student_id: meta.student_id || 'unknown_' + S.user.id.slice(0,8),
    email: S.user.email
  }).select().maybeSingle();
  if (!error && data){
    S.profile = data;
    await fetchAll();
    subscribeRealtime();
  }
  S.loading = false;
  render();
}
