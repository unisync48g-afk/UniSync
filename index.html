<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniSync — Class Collaboration</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235b8cff'/><text x='50' y='68' font-size='58' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>U</text></svg>">
<style>
:root{--bg:#0e1116;--panel:#151922;--panel2:#1b202b;--line:#262c38;--txt:#e6eaf2;--muted:#8b95a7;--accent:#5b8cff;--accent2:#8b5cf6;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-size:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3342;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.layout{display:flex;min-height:100vh}
.sidebar{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand .logo{width:32px;height:32px;border-radius:9px;flex:0 0 32px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
.brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.nav{padding:10px 8px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);cursor:pointer;margin-bottom:2px;font-weight:500;user-select:none;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--panel2);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(91,140,255,.18),rgba(139,92,246,.10));color:#fff}
.nav-item .ico{width:18px;text-align:center;font-size:15px;flex:0 0 18px}
.nav-sep{padding:14px 14px 6px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#5b6478;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;border-bottom:1px solid var(--line);background:rgba(14,17,22,.86);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:20}
.topbar .class-chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.5px;white-space:nowrap}
.searchbox{flex:1;max-width:420px;position:relative}
.searchbox input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 34px;color:var(--txt);outline:none}
.searchbox input:focus{border-color:var(--accent)}
.searchbox .si{position:absolute;left:11px;top:8px;color:var(--muted);font-size:13px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{background:var(--panel2);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;color:var(--txt);cursor:pointer;position:relative;display:grid;place-items:center;font-size:15px}
.icon-btn:hover{border-color:#39415a}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;font-weight:700}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;cursor:pointer;flex:0 0 36px}
.content{padding:22px;max-width:1220px;width:100%;margin:0 auto;flex:1}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{margin:0 0 3px;font-size:20px;font-weight:650;letter-spacing:-.2px}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:7px;transition:.12s;white-space:nowrap}
.btn:hover{border-color:#3a4256;background:#20263540}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#ffb4b4;border-color:#4a2530}
.btn.danger:hover{background:#2a1519}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--txt);background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.empty{text-align:center;padding:44px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:#12161d}
.empty .big{font-size:30px;display:block;margin-bottom:8px;opacity:.6}
.divider{height:1px;background:var(--line);margin:14px 0}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.blue{background:rgba(91,140,255,.14);border-color:rgba(91,140,255,.35);color:#9dbaff}
.tag.green{background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.3);color:#7ee2a4}
.tag.amber{background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.32);color:#f7c76a}
.tag.red{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.32);color:#ff9d9d}
.tag.purple{background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.35);color:#c3adff}
.tag.admin{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:#f7c76a}
.tag.teacher{background:rgba(20,184,166,.14);border-color:rgba(20,184,166,.4);color:#5eead4}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:550}
label.f > span .req{color:var(--danger)}
.inp,select.inp,textarea.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--txt);outline:none;transition:.12s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.12)}
textarea.inp{resize:vertical;min-height:82px}
select.inp{cursor:pointer}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.frow{grid-template-columns:1fr}}
.err{color:#ff9d9d;font-size:12px;margin-top:5px}
.overlay{position:fixed;inset:0;background:rgba(6,8,12,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:620px;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15.5px;font-weight:620}
.modal-head .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.modal-body{padding:18px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:11px;z-index:200;box-shadow:0 12px 32px rgba(0,0,0,.5);font-weight:550;animation:pop .18s}
.toast.ok{border-color:rgba(34,197,94,.45)}
.toast.err{border-color:rgba(239,68,68,.45)}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 20% 0%,rgba(91,140,255,.14),transparent 60%),radial-gradient(700px 500px at 90% 100%,rgba(139,92,246,.13),transparent 60%)}
.auth{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.auth h1{margin:0 0 4px;font-size:22px;font-weight:680;letter-spacing:-.3px}
.auth p.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .n{font-size:24px;font-weight:700;letter-spacing:-.5px}
.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;background:var(--panel2);border:1px solid transparent;transition:.12s}
.list-item:hover{border-color:var(--line)}
.list-item .lead{flex:1;min-width:0}
.list-item .t{font-weight:580;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotc{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-head div{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{min-height:92px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer;transition:.12s;overflow:hidden}
.cal-cell:hover{border-color:#39415a}
.cal-cell.blank{background:transparent;border-color:transparent;cursor:default}
.cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(91,140,255,.35)}
.cal-cell .dn{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.cal-cell.today .dn{color:var(--accent)}
.cal-ev{font-size:10.5px;padding:2px 5px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
@media(max-width:760px){.cal-cell{min-height:64px;padding:5px}.cal-ev{font-size:9px}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:10px 12px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#12161d}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.member-box{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px;background:var(--panel2)}
.member-box .mb-head{display:flex;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:600}
@media(max-width:900px){.layout{flex-direction:column}.sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}.brand{border-bottom:none;border-right:1px solid var(--line);padding:12px 14px}.brand h1,.brand small{display:none}.nav{display:flex;padding:8px;gap:4px;flex:1}.nav-sep{display:none}.nav-item{white-space:nowrap;margin:0;padding:8px 11px}.nav-item .lbl{display:none}.nav-item .ico{font-size:17px}.content{padding:16px}.topbar .class-chip{font-size:11px;padding:4px 10px}}
.file-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.14s}
.file-card:hover{border-color:#3a4256;transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.28)}
.file-icon{width:48px;height:58px;flex:0 0 48px;border-radius:8px;position:relative;background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.4px;box-shadow:0 4px 12px rgba(239,68,68,.28)}
.file-icon::after{content:'';position:absolute;top:0;right:0;width:14px;height:14px;background:linear-gradient(225deg,rgba(255,255,255,.55) 50%,transparent 50%);border-bottom-left-radius:6px}
.file-icon svg{width:20px;height:20px;stroke-width:2.2}
.file-body{flex:1;min-width:0}
.file-name{font-weight:600;font-size:14px;color:var(--txt);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:11.5px;color:var(--muted)}
.file-open{color:var(--accent);font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}
.group-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;transition:.14s}
.group-card:hover{border-color:#3a4256}
.group-head{display:flex;align-items:center;gap:12px}
.platform-badge{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.platform-badge svg{width:22px;height:22px}
.group-name{font-weight:620;font-size:14.5px;margin-bottom:3px}
.group-desc{font-size:12.5px;color:var(--muted);line-height:1.45}
.group-foot{display:flex;align-items:center;gap:8px;padding-top:4px}
.open-link{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;color:#fff;font-weight:600;font-size:12.5px;text-decoration:none;transition:.12s;border:none;cursor:pointer}
.open-link:hover{filter:brightness(1.08);transform:translateY(-1px)}
.code-block{background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#9dbaff;white-space:pre;overflow-x:auto;line-height:1.55;max-height:520px;overflow-y:auto;margin:0}
</style>

  try {

    var MY_SECRET = 'YOUR_SECRET_HERE';
    if (data.token !== MY_SECRET) {
      return ContentService.createTextOutput(JSON.stringify({ok:false, error:'unauthorized'})).setMimeType(ContentService.MimeType.JSON);
    }
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    if (data.action === 'deletePresentation') {
      var tabName = sanitizeTabName(data.presentation || '');
      var deletedTab = false;
      if (tabName) {
        var sheet = ss.getSheetByName(tabName);
        if (sheet) { ss.deleteSheet(sheet); deletedTab = true; }
      }
      var master = ss.getSheetByName('Submissions');
      var removedRows = 0;
      if (master && data.presentation) {
        var last = master.getLastRow();
        if (last > 1) {
          var values = master.getRange(2, 2, last - 1, 1).getValues();
          for (var i = values.length - 1; i >= 0; i--) {
            if (String(values[i][0]) === String(data.presentation)) { master.deleteRow(i + 2); removedRows++; }
          }
        }
      }
      return ContentService.createTextOutput(JSON.stringify({ok:true, deletedTab:deletedTab, removedRows:removedRows})).setMimeType(ContentService.MimeType.JSON);
    }
    var headers = ['Submission ID','Presentation','Course','Submitted At','Status','Submitter Student ID','Presentation Link','Team Name','Leader Name','Leader ID','Members','Dept','Batch','Section'];
    var members = (data.members || []).map(function(m){ return m.name + ' (' + m.id + ')'; }).join(', ');
    var row = [data.submissionId, data.presentation, data.course || '', data.submittedAt, data.status || 'Submitted', data.submitterId || '', data.link, data.teamName || '', data.leaderName, data.leaderId, members, data.dept || '', data.batch || '', data.section || ''];
    var masterSheet = ss.getSheetByName('Submissions') || ss.insertSheet('Submissions');
    upsertRow(masterSheet, headers, row, data.submissionId);
    var tabName2 = sanitizeTabName(data.presentation || 'Uncategorized');
    var perTab = ss.getSheetByName(tabName2) || ss.insertSheet(tabName2);
    upsertRow(perTab, headers, row, data.submissionId);
    if (data.scope === 'admin') {
      var sectionName = sanitizeTabName((data.dept || '') + '-' + (data.batch || '') + '-' + (data.section || ''));
      if (sectionName && sectionName !== '--') {
        var sectionTab = ss.getSheetByName(sectionName) || ss.insertSheet(sectionName);
        upsertRow(sectionTab, headers, row, data.submissionId);
      }
      if (data.course) {
        var courseName = sanitizeTabName(data.course);
        var courseTab = ss.getSheetByName(courseName) || ss.insertSheet(courseName);
        upsertRow(courseTab, headers, row, data.submissionId);
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ok:false, error:String(err)})).setMimeType(ContentService.MimeType.JSON);
  }
}
function upsertRow(sheet, headers, row, submissionId) {
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(headers);
    sheet.setFrozenRows(1);
    sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold');
  }
  var last = sheet.getLastRow();
  var found = -1;
  if (last > 1) {
    var ids = sheet.getRange(2, 1, last - 1, 1).getValues();
    for (var i = 0; i < ids.length; i++) {
      if (String(ids[i][0]) === String(submissionId)) { found = i + 2; break; }
    }
  }
  if (found > -1) { sheet.getRange(found, 1, 1, row.length).setValues([row]); }
  else { sheet.appendRow(row); }
}
function sanitizeTabName(name) {
  var clean = String(name).replace(/[^a-zA-Z0-9 _-]/g, '-').replace(/\s+/g, ' ').trim();
  if (clean.length > 90) clean = clean.substring(0, 90);
  return clean || 'Uncategorized';
}`;

const fmtDateTime = ds => { if(!ds) return '—'; return new Date(ds).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };

function meScopes(me){
  if (!me) return [];
  if (isAdmin(me)) return ['*'];
  const list = [{ dept:(me.dept||'').toUpperCase(), batch: me.batch, section:(me.section||'').toUpperCase() }];
  if (isTeacher(me) && Array.isArray(me.extra_sections)){
    me.extra_sections.forEach(s => { if (s && s.dept && s.batch && s.section) list.push({ dept: s.dept.toUpperCase(), batch: s.batch, section: s.section.toUpperCase() }); });
  }
  return list;
}
function inScope(me, row){
  if (isAdmin(me)) return true;
  if (!row.batch && !row.section && !row.dept) return true;
  const key = sectionKey(row.dept, row.batch, row.section);
  return meScopes(me).some(s => sectionKey(s.dept, s.batch, s.section) === key);
}

function subscribeRealtime(){
  channels.forEach(c => sb.removeChannel(c));
  channels = [];
  const tables = ['profiles','resources','notices','notice_acks','events','groups','presentations','submissions','notifications','class_info','section_configs','feedback','help_requests','help_replies','instructions','forms','form_responses','presentation_groups','group_join_requests'];
  tables.forEach(table => {
    const ch = sb.channel(`rt_${table}`).on('postgres_changes', { event:'*', schema:'public', table }, async () => {
      await fetchAll();
      if (S.modal) return;
      const a = document.activeElement;
      if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;

    }).subscribe();
    channels.push(ch);

async function doAuth(){
  const email = ($('#li_email')?.value||'').trim();
  const pw = ($('#li_pw')?.value||'');
  if (!email || !pw){ S.authError='Email and password are required.'; render(); return; }
  if (S.authMode === 'register'){
    const name = ($('#li_name')?.value||'').trim();
    const sid = ($('#li_sid')?.value||'').trim();
    const dept = ($('#rg_dept')?.value||'').trim().toUpperCase();
    const batch = ($('#rg_batch')?.value||'').trim();
    const section = ($('#rg_section')?.value||'').trim().toUpperCase();
    if (!name || !sid){ S.authError='Name and Student ID are required.'; render(); return; }
    if (!dept || !batch || !section){ S.authError='Department, batch and section are required.'; render(); return; }
    if (pw.length < 6){ S.authError='Password must be at least 6 characters.'; render(); return; }
    const { error } = await sb.auth.signUp({ email, password: pw, options: { data: { name, student_id: sid, dept, batch, section } } });
    if (error){ S.authError=error.message; render(); return; }
    toast('Account created! You can now sign in.');
    S.authMode='login'; S.authError=''; render();
    return;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error){ S.authError=error.message; render(); return; }
  S.authError='';
}

  const notices = DB.notices.filter(n=>!n.expires_at || n.expires_at>=today).slice(0,4);

  const mySubs = DB.submissions.filter(s=>s.submitted_by===u.id);
  const recentGroups = DB.groups.slice(0,3);
  const stat = (n,l) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  let greeting = isAdmin(u) ? 'You are the Administrator. You can see all sections.'
    : isTeacher(u) ? `You are a Teacher with access to ${meScopes(u).length} section(s).`
    : isCR(u) ? `You are a CR for ${classLabel(u)}. Your posts go to your section only.`
    : `Showing content for ${classLabel(u)}.`;
  let stats;
  if (isAdmin(u)) stats = `<div class="grid g4" style="margin-bottom:18px">${stat(DB.profiles.filter(x=>x.role==='student').length,'Students')}${stat(DB.profiles.filter(x=>x.role==='cr').length,'CRs')}${stat(DB.profiles.filter(x=>x.role==='teacher').length,'Teachers')}${stat(DB.help_requests.filter(h=>!h.resolved).length,'Open help')}</div>`;
  else if (canManage(u)) stats = `<div class="grid g4" style="margin-bottom:18px">${stat(DB.notices.length,'Notices')}${stat(DB.resources.length,'Resources')}${stat(DB.events.filter(e=>e.date>=today).length,'Upcoming events')}${stat(DB.submissions.length,'Submissions')}</div>`;
  else stats = `<div class="grid g4" style="margin-bottom:18px">${stat(todays.length,'Classes today')}${stat(upcoming.filter(e=>['Assignment','Quiz','Exam','Midterm','Final'].includes(e.type)).length,'Deadlines this week')}${stat(notices.length,'Active notices')}${stat(mySubs.length,'My submissions')}</div>`;
  const evRow = e => { const c = countdown(e.date); return `<div class="list-item"><div class="dotc" style="background:${EVENT_COLORS[e.type]||'#888'}"></div><div class="lead"><div class="t">${esc(e.title)}</div><div class="tiny muted">${fmtDate(e.date)} · ${esc(e.start_time)}–${esc(e.end_time)}${e.location?' · '+esc(e.location):''}</div></div><span class="tag ${c.cls}">${c.text}</span></div>`; };
  return `
    <div class="page-head"><div><h2>Hello, ${esc(u.name.split(' ')[0])} 👋</h2><p>${greeting}</p></div><div class="actions">${canManage(u) ? `<button class="btn" onclick="openModal('event')">+ Event</button><button class="btn" onclick="openModal('notice')">+ Notice</button><button class="btn primary" onclick="openModal('presentation')">+ Presentation</button>` : `<button class="btn primary" onclick="go('presentations')">Submit presentation</button>`}</div></div>
    ${stats}
    <div class="grid g2">
      <div class="card"><div class="row" style="margin-bottom:12px"><b style="font-size:14.5px">${todays.length?"Today's schedule":'Upcoming this week'}</b><button class="btn ghost sm" style="margin-left:auto" onclick="go('calendar')">View calendar →</button></div><div class="stack">${(todays.length?todays:upcoming).slice(0,5).map(evRow).join('') || `<div class="empty"><span class="big">🗓</span>Nothing scheduled.</div>`}</div></div>
      <div class="card"><div class="row" style="margin-bottom:12px"><b style="font-size:14.5px">Latest notices</b><button class="btn ghost sm" style="margin-left:auto" onclick="go('notices')">All →</button></div><div class="stack">${notices.map(n => `<div class="list-item" onclick="go('notices')" style="cursor:pointer"><div class="lead"><div class="t">${n.pinned?'📌 ':''}${esc(n.title)}</div><div class="tiny muted">${esc(n.category)} · ${fmtDate(n.created_at?.slice(0,10))}</div></div>${n.priority!=='Normal'?`<span class="tag ${PRIORITY_TAG[n.priority]}">${n.priority}</span>`:''}</div>`).join('') || `<div class="empty"><span class="big">📢</span>No notices yet.</div>`}</div></div>
      <div class="card"><div class="row" style="margin-bottom:12px"><b style="font-size:14.5px">Recently shared</b><button class="btn ghost sm" style="margin-left:auto" onclick="go('resources')">All →</button></div><div class="stack">${recentRes.map(r => `<div class="list-item"><div class="lead"><div class="t">${esc(r.title)}</div><div class="tiny muted">${esc(r.course||'—')} · ${esc(r.type)}</div></div><button class="btn sm" onclick="openResource('${r.id}')">Open</button></div>`).join('') || `<div class="empty"><span class="big">📚</span>No resources yet.</div>`}</div></div>
      <div class="card"><div class="row" style="margin-bottom:12px"><b style="font-size:14.5px">Class groups</b><button class="btn ghost sm" style="margin-left:auto" onclick="go('groups')">All →</button></div><div class="stack">${recentGroups.map(g => { const meta = PLATFORM_META[g.platform] || PLATFORM_META.other; return `<a class="list-item" href="${esc(g.link)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div class="platform-badge" style="width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:${meta.color}">${meta.svg}</div><div class="lead"><div class="t">${esc(g.name)}</div><div class="tiny muted">${meta.name}</div></div></a>`; }).join('') || `<div class="empty" style="padding:24px"><span class="big">💬</span>No groups.</div>`}</div></div>
    </div>`;
}

/* =========================================================
   RESOURCES
   ========================================================= */
function viewResources(u){
  const f = S.resFilter;
  const courses = [...new Set(DB.resources.map(r=>r.course).filter(Boolean))].sort();
  let list = [...DB.resources];
  if (f.q){ const q = f.q.toLowerCase(); list = list.filter(r => [r.title,r.course,r.topic,r.teacher,(r.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)); }
  if (f.course) list = list.filter(r => r.course === f.course);
  if (f.type) list = list.filter(r => r.type === f.type);
  return `
    <div class="page-head"><div><h2>Resources & Notes</h2><p>Shared study materials for ${esc(classLabel(u))}. Anyone can upload.</p></div><div class="actions"><button class="btn primary" onclick="openModal('resource')">+ Upload resource</button></div></div>
    <div class="card" style="margin-bottom:16px"><div class="row wrap"><input class="inp" style="flex:2;min-width:200px" placeholder="Search…" value="${esc(f.q)}" data-fk="resq" oninput="S.resFilter.q=this.value;render()"><select class="inp" style="flex:1;min-width:150px" onchange="S.resFilter.course=this.value;render()"><option value="">All courses</option>${courses.map(c=>`<option ${f.course===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="inp" style="flex:1;min-width:150px" onchange="S.resFilter.type=this.value;render()"><option value="">All types</option>${RESOURCE_TYPES.map(t=>`<option ${f.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div>
    ${list.length ? `<div class="grid g2">${list.map(r => resourceCard(r, u)).join('')}</div>` : `<div class="empty"><span class="big">📚</span>No resources in this section yet.</div>`}`;
}
function resourceCard(r, u){
  const canEdit = canManage(u) || r.uploaded_by === u.id;
  if (isDrivePdf(r)){
    const cleanName = (r.title||'').replace(/\.pdf$/i,'');
    return `<div class="card" style="padding:12px"><div class="file-card" onclick="openResource('${r.id}')" style="background:var(--panel2)"><div class="file-icon">${PDF_ICON}</div><div class="file-body"><div class="file-name">${esc(cleanName)}</div><div class="file-meta">PDF · Drive ${r.course?' · '+esc(r.course):''}</div><div class="file-meta" style="margin-top:3px">by ${esc(nameOf(r.uploaded_by))} · ${fmtDate(r.uploaded_at?.slice(0,10))}</div></div><div class="file-open">Open in Drive ↗</div></div>${canEdit ? `<div class="row" style="margin-top:8px;gap:6px"><button class="btn sm" style="margin-left:auto" onclick="openModal('resource',{id:'${r.id}'})">✎ Edit</button><button class="btn danger sm" onclick="deleteResource('${r.id}')">Delete</button></div>` : ''}</div>`;
  }
  return `<div class="card"><div style="font-weight:620;font-size:14.5px;margin-bottom:4px">${esc(r.title)}</div><div class="row wrap tiny muted" style="gap:6px;margin-bottom:8px">${r.course?`<span class="tag blue">${esc(r.course)}</span>`:''}<span class="tag">${esc(r.type)}</span></div><div class="tiny muted" style="margin-bottom:10px">by ${esc(nameOf(r.uploaded_by))} · ${fmtDate(r.uploaded_at?.slice(0,10))}</div><div class="row"><button class="btn primary sm" onclick="openResource('${r.id}')">Open</button>${canEdit ? `<button class="btn sm" style="margin-left:auto" onclick="openModal('resource',{id:'${r.id}'})">✎ Edit</button><button class="btn danger sm" onclick="deleteResource('${r.id}')">Delete</button>` : ''}</div></div>`;
}
async function openResource(id){
  const r = DB.resources.find(x=>x.id===id); if (!r) return;
  await sb.from('resources').update({ downloads: (r.downloads||0)+1 }).eq('id', id);
  if (r.link) window.open(r.link, '_blank', 'noopener');
  else if (r.file_path){ const { data } = sb.storage.from('resources').getPublicUrl(r.file_path); window.open(data.publicUrl, '_blank', 'noopener'); }
  else toast('No link attached', 'err');
}
async function deleteResource(id){
  const r = DB.resources.find(x=>x.id===id); if (!r) return;
  if (!confirm('Delete "' + r.title + '"?')) return;
  if (r.file_path) await sb.storage.from('resources').remove([r.file_path]);
  await sb.from('resources').delete().eq('id', id);
  toast('Resource deleted');
}

/* =========================================================
   NOTICES
   ========================================================= */
function viewNotices(u){
  const today = iso(0);
  let list = DB.notices.filter(n => !n.expires_at || n.expires_at >= today || canManage(u));
  if (S.noticeFilter !== 'All') list = list.filter(n => n.category === S.noticeFilter);
  list.sort((a,b) => (b.pinned - a.pinned) || (b.created_at||'').localeCompare(a.created_at||''));
  return `
    <div class="page-head"><div><h2>Notices & Announcements</h2><p>${canManage(u) ? `Your posts go to ${esc(classLabel(u))} only.` : `Notices for ${esc(classLabel(u))}.`}</p></div>${canManage(u) ? `<div class="actions"><button class="btn primary" onclick="openModal('notice')">+ New notice</button></div>` : ''}</div>
    <div class="row wrap" style="margin-bottom:16px">${['All',...NOTICE_CATS].map(c => `<button class="btn sm ${S.noticeFilter===c?'primary':''}" onclick="S.noticeFilter='${c}';render()">${c}</button>`).join('')}</div>
    <div class="stack">${list.map(n => {
      const acked = DB.notice_acks.some(a => a.notice_id === n.id && a.user_id === u.id);
      const ackCount = DB.notice_acks.filter(a => a.notice_id === n.id).length;
      return `<div class="card" style="border-left:3px solid ${n.priority==='Urgent'?'var(--danger)':n.priority==='Important'?'var(--warn)':'var(--line)'}"><div class="row" style="align-items:flex-start;margin-bottom:8px"><div style="flex:1;min-width:0"><div style="font-weight:640;font-size:15px;margin-bottom:5px">${n.pinned?'📌 ':''}${esc(n.title)}</div><div class="row wrap tiny muted" style="gap:6px"><span class="tag blue">${esc(n.category)}</span>${n.priority!=='Normal'?`<span class="tag ${PRIORITY_TAG[n.priority]}">${n.priority}</span>`:''}${n.dept?`<span class="tag">${esc((n.dept||'').toUpperCase())}-${esc(n.batch||'')}-${esc((n.section||'').toUpperCase())}</span>`:''}<span>by ${esc(nameOf(n.created_by))} · ${fmtDateTime(n.created_at)}</span></div></div>${canManage(u) ? `<div class="row" style="gap:4px"><button class="icon-btn" style="width:30px;height:30px;font-size:12px" title="Edit" onclick="openModal('notice',{id:'${n.id}'})">✎</button><button class="icon-btn" style="width:30px;height:30px;font-size:12px" title="Delete" onclick="deleteNotice('${n.id}')">🗑</button></div>` : ''}</div><div style="white-space:pre-wrap;line-height:1.6;color:#cfd6e4">${esc(n.body)}</div><div class="divider"></div><div class="row wrap"><span class="tiny muted">${ackCount} acknowledged</span>${!canManage(u) ? (acked ? `<span class="tag green" style="margin-left:auto">✓ Acknowledged</span>` : `<button class="btn sm primary" style="margin-left:auto" onclick="ackNotice('${n.id}')">Acknowledge</button>`) : ''}</div></div>`;
    }).join('') || `<div class="empty"><span class="big">📢</span>No notices for this section yet.</div>`}</div>`;
}
async function ackNotice(id){ await sb.from('notice_acks').insert({ notice_id: id, user_id: S.profile.id }); toast('Acknowledged'); }
async function deleteNotice(id){ if (!confirm('Delete this notice?')) return; await sb.from('notices').delete().eq('id', id); toast('Notice deleted'); }

/* =========================================================
   CALENDAR
   ========================================================= */
function viewCalendar(u){
  const now = new Date();
  if (S.calYear === null){ S.calYear = now.getFullYear(); S.calMonth = now.getMonth(); }
  const y = S.calYear, m = S.calMonth;
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = iso(0);
  const monthName = new Date(y, m, 1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let cells = '';
  for (let i=0;i<firstDow;i++) cells += `<div class="cal-cell blank"></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = DB.events.filter(e=>e.date===ds).sort(sortByDate);
    cells += `<div class="cal-cell ${ds===todayStr?'today':''}" onclick="openModal('day',{date:'${ds}'})"><div class="dn">${d}</div>${evs.slice(0,3).map(e=>`<div class="cal-ev" style="background:${(EVENT_COLORS[e.type]||'#888')}22;color:${EVENT_COLORS[e.type]||'#888'};border-left:2px solid ${EVENT_COLORS[e.type]||'#888'}">${esc(e.title)}</div>`).join('')}</div>`;
  }
  const upcoming = DB.events.filter(e => e.date >= todayStr).sort(sortByDate).slice(0,8);
  const legend = EVENT_TYPES.map(t=>`<span class="row tiny" style="gap:5px"><span class="dotc" style="background:${EVENT_COLORS[t]}"></span>${t}</span>`).join('');
  return `
    <div class="page-head"><div><h2>Class Calendar</h2><p>Routine, exams, deadlines for ${esc(classLabel(u))}.</p></div>${canManage(u) ? `<div class="actions"><button class="btn primary" onclick="openModal('event')">+ Add event</button></div>` : ''}</div>
    <div class="card" style="margin-bottom:16px"><div class="row" style="margin-bottom:14px"><button class="btn sm" onclick="calMove(-1)">‹</button><b style="font-size:15px;min-width:170px;text-align:center">${monthName}</b><button class="btn sm" onclick="calMove(1)">›</button><button class="btn ghost sm" onclick="calToday()">Today</button><div class="row wrap" style="margin-left:auto;gap:12px">${legend}</div></div><div class="cal-head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-grid">${cells}</div></div>
    <div class="card"><b style="font-size:14.5px">Upcoming events</b><div class="stack" style="margin-top:12px">${upcoming.map(e=>{ const c = countdown(e.date); return `<div class="list-item"><div class="dotc" style="background:${EVENT_COLORS[e.type]||'#888'}"></div><div class="lead"><div class="t">${esc(e.title)}</div><div class="tiny muted">${fmtDate(e.date)} · ${esc(e.start_time)}–${esc(e.end_time)}${e.location?' · '+esc(e.location):''}</div></div><span class="tag ${c.cls}">${c.text}</span>${canManage(u)?`<div class="row" style="gap:4px"><button class="icon-btn" style="width:30px;height:30px;font-size:12px" title="Edit" onclick="openModal('event',{id:'${e.id}'})">✎</button><button class="icon-btn" style="width:30px;height:30px;font-size:12px" title="Delete" onclick="deleteEvent('${e.id}')">🗑</button></div>`:''}</div>`; }).join('') || `<div class="empty"><span class="big">🗓</span>No upcoming events.</div>`}</div></div>`;
}
function calMove(delta){ let m = S.calMonth + delta, y = S.calYear; if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; } S.calMonth = m; S.calYear = y; render(); }
function calToday(){ const n = new Date(); S.calYear = n.getFullYear(); S.calMonth = n.getMonth(); render(); }
async function deleteEvent(id){ if (!confirm('Delete this event?')) return; await sb.from('events').delete().eq('id', id); toast('Event deleted'); }

}
async function deleteGroup(id){ if (!confirm('Remove this group?')) return; await sb.from('groups').delete().eq('id', id); toast('Group removed'); }

/* =========================================================
   PRESENTATIONS
   ========================================================= */
function viewPresentations(u){
  if (!DB.presentations.length){
    return `<div class="page-head"><div><h2>Presentation Submissions</h2><p>No events yet for ${esc(classLabel(u))}.</p></div>${canManage(u)?`<div class="actions"><button class="btn primary" onclick="openModal('presentation')">+ New presentation</button></div>`:''}</div><div class="empty"><span class="big">🎤</span>No presentation events.</div>`;
  }
  const selId = S.selectedPresentation && DB.presentations.some(p=>p.id===S.selectedPresentation) ? S.selectedPresentation : DB.presentations[0].id;
  const p = DB.presentations.find(x=>x.id===selId);
  const subs = DB.submissions.filter(s => s.presentation_id === p.id);
  const c = countdown(p.deadline);
  const closed = daysUntil(p.deadline) < 0;
  const coveredIds = new Set();
  subs.forEach(s => { coveredIds.add(s.leader_id); (s.members||[]).forEach(m => coveredIds.add(String(m.id).trim())); });
  const scopes = meScopes(u);
  const notSubmitted = DB.profiles.filter(x => x.role !== 'admin' && scopes.some(s => (x.dept||'').toUpperCase() === s.dept && x.batch === s.batch && (x.section||'').toUpperCase() === s.section) && !coveredIds.has(x.student_id));
  const mySub = subs.find(s => s.leader_id === u.student_id || (s.members||[]).some(m => String(m.id).trim() === u.student_id));
  const secKey = sectionKey(p.dept, p.batch, p.section);
  const cfg = DB.section_configs.find(c => sectionKey(c.dept, c.batch, c.section) === secKey);
  return `

async function deletePresentation(id){
  const p = DB.presentations.find(x=>x.id===id); if (!p) return;
  const subCount = DB.submissions.filter(s => s.presentation_id === id).length;
  if (!confirm(`Delete "${p.title}"?\n\nThis will permanently delete the presentation and ${subCount} submission(s).`)) return;
  await sb.from('submissions').delete().eq('presentation_id', id);
  const { error } = await sb.from('presentations').delete().eq('id', id);
  if (error){ toast(error.message, 'err'); return; }
  syncDeleteToSheet(p); S.selectedPresentation = null; toast('Presentation deleted'); render();
}
async function syncDeleteToSheet(p){
  const sectionCfg = DB.section_configs.find(c => c.dept !== '*' && sectionKey(c.dept, c.batch, c.section) === sectionKey(p.dept, p.batch, p.section));
  const adminCfg = DB.section_configs.find(c => c.dept === '*');
  const base = { action: 'deletePresentation', presentation: p.title, dept: (p.dept || '').toUpperCase(), batch: p.batch || '', section: (p.section || '').toUpperCase() };
  if (sectionCfg?.webhook_url && !sectionCfg.webhook_url.includes('PASTE_')){
    try { await fetch(sectionCfg.webhook_url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ ...base, token: sectionCfg.webhook_secret || '', scope: 'section' }), keepalive: true }); } catch(e){}
  }
  if (adminCfg?.webhook_url && !adminCfg.webhook_url.includes('PASTE_')){
    try { await fetch(adminCfg.webhook_url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ ...base, token: adminCfg.webhook_secret || '', scope: 'admin' }), keepalive: true }); } catch(e){}
  }
  return true;
}
async function deleteSubmission(id){
  if (!confirm('Remove this submission? You can submit again if the deadline has not passed.')) return;
  const { error } = await sb.from('submissions').delete().eq('id', id);
  if (error){ toast(error.message, 'err'); return; }
  toast('Submission removed');
}
async function remindNonSubmitters(pid){
  const p = DB.presentations.find(x=>x.id===pid); if (!p) return;
  const covered = new Set();
  DB.submissions.filter(s=>s.presentation_id===pid).forEach(s=>{ covered.add(s.leader_id); (s.members||[]).forEach(m=>covered.add(String(m.id).trim())); });
  const scopes = meScopes(S.profile);
  const targets = DB.profiles.filter(x => x.role !== 'admin' && scopes.some(s => (x.dept||'').toUpperCase() === s.dept && x.batch === s.batch && (x.section||'').toUpperCase() === s.section) && !covered.has(x.student_id)).map(x=>x.id);
  if (!targets.length){ toast('Everyone submitted'); return; }
  await notify(targets, 'Presentation reminder', `You haven't submitted for "${p.title}". Deadline: ${fmtDate(p.deadline)}.`, 'presentations');
  toast(`Reminder sent to ${targets.length} student(s)`);
}
function exportSubmissions(pid){
  const p = DB.presentations.find(x=>x.id===pid) || { title:'Presentation', course:'' };
  const subs = DB.submissions.filter(s => s.presentation_id === pid);
  const maxMembers = Math.max(0, ...subs.map(s => (s.members||[]).length));
  const headers = ['Team','Leader Name','Leader ID','Link','Submitted'];
  for (let i=1;i<=maxMembers;i++) headers.push(`Member ${i} Name`, `Member ${i} ID`);
  const rows = subs.map(s => { const row = [s.team_name||'', s.leader_name, s.leader_id, s.link, s.submitted_at]; for (let i=0;i<maxMembers;i++){ const m = (s.members||[])[i]; row.push(m ? m.name : '', m ? m.id : ''); } return row; });
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `submissions_${p.title.replace(/\W+/g,'_')}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); toast('CSV exported');
}

function openPgroupDetail(gid){ pgroupDetailId = gid; openModal('pgroupDetail', { id: gid }); }

function togglePgroupDraftMember(uidTarget){
  const i = pgroupDraft.members.indexOf(uidTarget);
  if (i > -1){ pgroupDraft.members.splice(i, 1); render(); return; }
  const m = S.modal;
  const g = m && m.id ? DB.presentation_groups.find(x => x.id === m.id) : null;
  const currentCount = g ? (g.members || []).length : 0;
  const projectedTotal = 1 + currentCount + pgroupDraft.members.length + 1;
  if (projectedTotal > pgroupDraft.maxSize){ toast(`Team size limit (${pgroupDraft.maxSize}) reached`, 'err'); return; }
  pgroupDraft.members.push(uidTarget);
  render();
}

async function savePgroup(id){
  const name = $('#pg_name')?.value.trim();
  const topic = $('#pg_topic')?.value.trim() || '';
  const maxSize = parseInt($('#pg_max')?.value) || 4;
  if (!name){ toast('Group name required', 'err'); return; }
  if (maxSize < 1){ toast('Max size must be at least 1', 'err'); return; }
  const me = S.profile;
  const data = { name, topic, max_size: maxSize, dept: (me.dept||'').toUpperCase(), batch: me.batch, section: (me.section||'').toUpperCase() };
  let groupId = id;
  if (id){
    const { error } = await sb.from('presentation_groups').update(data).eq('id', id);
    if (error){ toast(error.message, 'err'); return; }
  } else {
    const { data: created, error } = await sb.from('presentation_groups').insert({ ...data, leader_id: me.id, members: [] }).select().single();
    if (error){ toast(error.message, 'err'); return; }
    groupId = created.id;
  }
  const g = DB.presentation_groups.find(x => x.id === groupId) || { members: [] };
  const currentMembers = g.members || [];
  const alreadyInvited = DB.group_join_requests.filter(r => r.group_id === groupId && r.direction === 'invite' && r.status === 'pending').map(r => r.user_id);
  const newInvitees = pgroupDraft.members.filter(uidTarget => !currentMembers.includes(uidTarget) && !alreadyInvited.includes(uidTarget));
  const projectedTotal = 1 + currentMembers.length + pgroupDraft.members.length;
  if (projectedTotal > maxSize){
    toast(`Team size limit is ${maxSize}. Currently ${projectedTotal} would be invited/joined.`, 'err');
    return;
  }
  if (newInvitees.length){
    await sb.from('group_join_requests').delete().eq('group_id', groupId).in('user_id', newInvitees);
    const inviteRows = newInvitees.map(uidTarget => ({ group_id: groupId, user_id: uidTarget, direction: 'invite', status: 'pending', message: '' }));
    const { error: invErr } = await sb.from('group_join_requests').insert(inviteRows);
    if (invErr){ toast('Invite failed: ' + invErr.message, 'err'); return; }
    for (const uidTarget of newInvitees){
      await notify(uidTarget, '✉️ Group invitation', `${me.name} invited you to join "${name}". Open Presentation Groups to accept.`, 'pgroups');
    }
  }
  if (!id){ await notifyClass(me.id, 'New presentation group', `${me.name} created "${name}".`, 'pgroups'); toast('Group created · Invitations sent'); }
  else { toast(newInvitees.length ? `Group updated · ${newInvitees.length} invitation(s) sent` : 'Group updated'); }
  closeModal();
}

async function leaveGroup(gid){
  const g = DB.presentation_groups.find(x => x.id === gid); if (!g) return;
  if (g.leader_id === S.profile.id){ toast('You are the leader. Transfer leadership first.', 'err'); return; }
  if (!confirm('Leave this group?')) return;
  const members = (g.members || []).filter(m => m !== S.profile.id);
  const { error } = await sb.from('presentation_groups').update({ members }).eq('id', gid);
  if (error){ toast(error.message, 'err'); return; }
  await notify(g.leader_id, 'Member left group', `${S.profile.name} left "${g.name}".`, 'pgroups');
  toast('Left group');
}
async function removeGroupMember(gid, uidTarget){
  const g = DB.presentation_groups.find(x => x.id === gid); if (!g) return;
  if (g.leader_id !== S.profile.id){ toast('Only leader can remove members', 'err'); return; }
  if (uidTarget === S.profile.id){ toast('Cannot remove yourself', 'err'); return; }
  const m = profileOf(uidTarget);
  if (!confirm(`Remove ${m?.name || 'member'} from the group?`)) return;
  const members = (g.members || []).filter(x => x !== uidTarget);
  const { error } = await sb.from('presentation_groups').update({ members }).eq('id', gid);
  if (error){ toast(error.message, 'err'); return; }
  await notify(uidTarget, 'Removed from group', `You were removed from "${g.name}".`, 'pgroups');
  toast('Member removed'); closeModal();
}
async function transferLeadership(gid, uidTarget){
  const g = DB.presentation_groups.find(x => x.id === gid); if (!g) return;
  if (g.leader_id !== S.profile.id){ toast('Only leader can transfer', 'err'); return; }
  const m = profileOf(uidTarget);
  if (!confirm(`Make ${m?.name || 'this member'} the new leader?`)) return;
  const newMembers = (g.members || []).filter(x => x !== uidTarget);
  newMembers.push(g.leader_id);
  const { error } = await sb.from('presentation_groups').update({ leader_id: uidTarget, members: newMembers }).eq('id', gid);
  if (error){ toast(error.message, 'err'); return; }
  await notify(uidTarget, 'You are now a group leader', `You are now the leader of "${g.name}".`, 'pgroups');
  toast('Leadership transferred'); closeModal();

function getTakenOptions(formId, fieldId){

  DB.form_responses.filter(r => r.form_id === formId).forEach(r => {

    const u = profileOf(r.user_id);

    if (Array.isArray(v)){ v.forEach(opt => { taken[opt] = info; }); }

async function saveForm(id){
  const title = $('#fm_title')?.value.trim();

    const f = formFieldsDraft[i];
    if (!f.label || !f.label.trim()){ toast(`Question ${i+1}: label required`, 'err'); return; }
    if ((f.type === 'choice' || f.type === 'checkbox' || f.type === 'dropdown') && (!f.options || !f.options.length)){ toast(`Question ${i+1}: add at least one option`, 'err'); return; }
  }
  const me = S.profile;
  const data = {

    fields: formFieldsDraft.map(f => ({ id: f.id, type: f.type, label: f.label.trim(), required: !!f.required, placeholder: (f.placeholder||'').trim(), options: (f.options||[]).map(o => String(o).trim()).filter(Boolean), unique: !!f.unique })),
    dept: (me.dept||'').toUpperCase(), batch: me.batch, section: (me.section||'').toUpperCase()
  };
  let error;

async function submitFormResponse(formId){
  const f = DB.forms.find(x=>x.id===formId); if (!f) return;
  const fields = f.fields || [];
  const answers = {};
  for (const field of fields){
    const el = document.getElementById('ff_'+field.id);
    let val;
    if (field.type === 'checkbox'){ val = Array.from(document.querySelectorAll(`[data-cb="${field.id}"]:checked`)).map(x => x.value); }
    else if (field.type === 'rating'){ val = formFillAnswers[field.id] || 0; }
    else { val = el ? el.value : ''; if (typeof val === 'string') val = val.trim(); }
    const empty = (Array.isArray(val) && !val.length) || (!Array.isArray(val) && !val);
    if (field.required && empty){ toast(`"${field.label}" is required`, 'err'); return; }
    answers[field.id] = val;
  }
  for (const field of fields){
    if (!field.unique) continue;
    const chosen = answers[field.id];
    if (!chosen) continue;
    const chosenList = Array.isArray(chosen) ? chosen : [chosen];
    const taken = getTakenOptions(formId, field.id);
    for (const opt of chosenList){
      if (taken[opt] && taken[opt].userId !== S.profile.id){ toast(`"${opt}" is already taken by ${taken[opt].name}`, 'err'); return; }
    }
  }
  const existing = DB.form_responses.find(r => r.form_id === formId && r.user_id === S.profile.id);
  let error;
  if (existing){ ({ error } = await sb.from('form_responses').update({ answers, submitted_at: new Date().toISOString() }).eq('id', existing.id)); }
  else { ({ error } = await sb.from('form_responses').insert({ form_id: formId, user_id: S.profile.id, answers })); }
  if (error){ toast(error.message, 'err'); return; }
  toast(existing ? 'Response updated' : 'Response submitted'); closeModal();
}
async function deleteFormResponse(id){
  if (!confirm('Delete this response?')) return;
  const { error } = await sb.from('form_responses').delete().eq('id', id);
  if (error){ toast(error.message, 'err'); return; }
  toast('Response deleted'); closeModal();
}
function exportFormResponses(formId){
  const f = DB.forms.find(x=>x.id===formId); if (!f) return;
  const fields = f.fields || [];
  const responses = DB.form_responses.filter(r => r.form_id === formId);
  const headers = ['Responder Name', 'Student ID', 'Submitted At', ...fields.map(x => x.label)];
  const rows = responses.map(r => { const u = profileOf(r.user_id); const row = [u?.name || 'Unknown', u?.student_id || '', r.submitted_at]; fields.forEach(field => { const v = r.answers?.[field.id]; row.push(Array.isArray(v) ? v.join(', ') : (v || '')); }); return row; });
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `responses_${f.title.replace(/\W+/g,'_')}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); toast('CSV exported');
}

async function saveInstruction(id){
  const title = $('#in_title').value.trim(); const body = $('#in_body').value.trim();
  if (!title || !body){ toast('Title and body required', 'err'); return; }
  if (id){ const { error } = await sb.from('instructions').update({ title, body }).eq('id', id); if (error){ toast(error.message, 'err'); return; } toast('Instruction updated'); }
  else { const { error } = await sb.from('instructions').insert({ title, body, created_by: S.profile.id }); if (error){ toast(error.message, 'err'); return; } toast('Instruction added'); }

}
async function deleteInstruction(id){ if (!confirm('Delete this instruction?')) return; const { error } = await sb.from('instructions').delete().eq('id', id); if (error){ toast(error.message, 'err'); return; } toast('Instruction deleted'); }

function viewHelp(u){
  const me = S.profile;
  const myScopes = meScopes(me);
  const visible = DB.help_requests.filter(h => {
    if (isAdmin(me)) return true;
    if (h.user_id === me.id) return true;
    const sameScope = myScopes.some(s => (h.dept||'').toUpperCase() === s.dept && h.batch === s.batch && (h.section||'').toUpperCase() === s.section);
    if (!sameScope) return false;
    if (h.target === 'students') return me.role === 'student' || isCR(me) || isTeacher(me);
    if (h.target === 'cr') return me.role === 'cr';
    if (h.target === 'teacher') return me.role === 'teacher';
    return false;
  });
  return `<div class="page-head"><div><h2>Help / Ask</h2><p>Ask for help from specific groups.</p></div><div class="actions"><button class="btn primary" onclick="openModal('helpRequest')">+ New request</button></div></div><div class="stack">${visible.map(h => { const author = profileOf(h.user_id); const replies = DB.help_replies.filter(r => r.request_id === h.id); return `<div class="card"><div class="row" style="align-items:flex-start;margin-bottom:8px"><div style="flex:1;min-width:0"><div style="font-weight:640;font-size:15px;margin-bottom:5px">${h.resolved?'✅ ':''}${esc(h.title)}</div><div class="row wrap tiny muted" style="gap:6px"><span class="tag ${h.target==='cr'?'purple':h.target==='teacher'?'teacher':'blue'}">to: ${h.target==='cr'?'CR':h.target==='teacher'?'Teacher':'All Students'}</span><span class="tag">${esc((h.dept||'').toUpperCase())}-${esc(h.batch||'')}-${esc((h.section||'').toUpperCase())}</span>${author?`<span>by ${esc(author.name)}</span>`:''}<span>${fmtDateTime(h.created_at)}</span></div></div>${h.user_id === me.id ? `<button class="btn sm ${h.resolved?'':'primary'}" onclick="toggleHelpResolved('${h.id}',${!h.resolved})">${h.resolved?'Reopen':'Mark resolved'}</button>` : ''}</div><div style="white-space:pre-wrap;line-height:1.6;color:#cfd6e4">${esc(h.body)}</div><div class="divider"></div><div class="stack" style="gap:8px">${replies.map(r => { const rep = profileOf(r.user_id); return `<div style="background:var(--panel2);padding:10px;border-radius:8px"><div class="tiny muted" style="margin-bottom:4px">${esc(rep?.name||'User')} · ${fmtDateTime(r.created_at)}</div><div style="white-space:pre-wrap;line-height:1.55">${esc(r.body)}</div></div>`; }).join('') || `<div class="tiny muted">No replies yet.</div>`}</div><div class="divider"></div><div class="row" style="gap:6px"><input class="inp" id="hr_${h.id}" placeholder="Write a reply…" style="flex:1" onkeydown="if(event.key==='Enter')submitHelpReply('${h.id}')"><button class="btn primary sm" onclick="submitHelpReply('${h.id}')">Reply</button></div></div>`; }).join('') || `<div class="empty"><span class="big">🆘</span>No help requests for you right now.</div>`}</div>`;
}
async function submitHelpReply(hid){
  const el = document.getElementById('hr_'+hid); const body = (el?.value||'').trim();
  if (!body) return;
  const { error } = await sb.from('help_replies').insert({ request_id: hid, user_id: S.profile.id, body });
  if (error){ toast(error.message, 'err'); return; }
  if (el) el.value = ''; toast('Reply posted');
}
async function toggleHelpResolved(hid, val){ await sb.from('help_requests').update({ resolved: val }).eq('id', hid); toast(val ? 'Marked resolved' : 'Reopened'); }
function viewManageUsers(u){
  if (!isAdmin(u)) return `<div class="empty">Admins only.</div>`;
  const students = DB.profiles.filter(x => x.role === 'student');
  const crs = DB.profiles.filter(x => x.role === 'cr');
  const teachers = DB.profiles.filter(x => x.role === 'teacher');
  const admins = DB.profiles.filter(x => x.role === 'admin');
  const rowFor = m => `<tr><td><div class="row"><div class="avatar" style="width:30px;height:30px;flex:0 0 30px;border-radius:9px;font-size:11px;background:${colorFor(m.id)}">${esc(initials(m.name))}</div><div><div style="font-weight:600;font-size:13px">${esc(m.name)}</div><div class="tiny muted">${esc(m.email||'')}</div></div></div></td><td class="small">${esc(m.student_id)}</td><td class="small">${esc(classLabel(m))}</td><td>${roleBadge(m)}</td><td style="text-align:right;white-space:nowrap">${m.role !== 'admin' ? `<select class="inp" style="width:auto;display:inline-block;padding:4px 8px;font-size:12px" onchange="changeRole('${m.id}', this.value)"><option value="student" ${m.role==='student'?'selected':''}>Student</option><option value="cr" ${m.role==='cr'?'selected':''}>CR</option><option value="teacher" ${m.role==='teacher'?'selected':''}>Teacher</option></select><button class="btn sm danger" style="margin-left:6px" onclick="removeMember('${m.id}')">Remove</button>` : ''}</td></tr>`;

async function changeRole(id, role){
  const m = DB.profiles.find(x=>x.id===id); if (!m) return;
  if (!confirm(`Change ${m.name}'s role to ${role}?`)) return;
  const { error } = await sb.from('profiles').update({ role }).eq('id', id);
  if (error){ toast(error.message, 'err'); return; }
  await notify(id, 'Your role changed', `You are now a ${role}.`, 'dashboard');
  toast('Role updated');
}
async function removeMember(id){
  const m = DB.profiles.find(x=>x.id===id); if (!m) return;
  if (m.role === 'admin'){ toast('Cannot remove admin', 'err'); return; }
  if (!confirm(`Remove ${m.name} from UniSync?`)) return;
  const { error } = await sb.from('profiles').update({ disabled: true }).eq('id', id);
  if (error){ toast(error.message, 'err'); return; }
  toast('Member removed');
}

function doSearch(q){ S.search = q; if (q.trim() && S.route !== 'search') S.route = 'search'; if (!q.trim() && S.route === 'search') S.route = 'dashboard'; render(); }
function viewSearch(u){
  const q = S.search.trim().toLowerCase();
  if (!q) return `<div class="empty"><span class="big">🔍</span>Type something to search.</div>`;
  const res = DB.resources.filter(r => [r.title,r.course,r.topic,r.teacher].join(' ').toLowerCase().includes(q));
  const not = DB.notices.filter(n => (n.title + ' ' + n.body).toLowerCase().includes(q));
  const evs = DB.events.filter(e => [e.title,e.course,e.location,e.type].join(' ').toLowerCase().includes(q));
  const myScopes = meScopes(u);
  const mem = DB.profiles.filter(m => isAdmin(u) || myScopes.some(s => (m.dept||'').toUpperCase() === s.dept && m.batch === s.batch && (m.section||'').toUpperCase() === s.section)).filter(m => (m.name + ' ' + m.student_id).toLowerCase().includes(q));
  const grs = DB.groups.filter(g => (g.name + ' ' + (g.description||'')).toLowerCase().includes(q));
  const fms = DB.forms.filter(f => (f.title + ' ' + (f.description||'')).toLowerCase().includes(q));
  const pgs = DB.presentation_groups.filter(g => (g.name + ' ' + (g.topic||'')).toLowerCase().includes(q));
  const total = res.length + not.length + evs.length + mem.length + grs.length + fms.length + pgs.length;
  const block = (title, items, renderer) => items.length ? `<div class="card" style="margin-bottom:14px"><b style="font-size:14px">${title} <span class="muted">(${items.length})</span></b><div class="stack" style="margin-top:10px">${items.map(renderer).join('')}</div></div>` : '';
  return `<div class="page-head"><div><h2>Search</h2><p>${total} result${total!==1?'s':''} for "${esc(S.search)}"</p></div></div>${total ? '' : `<div class="empty"><span class="big">🔍</span>Nothing found.</div>`}${block('Resources', res, r => `<div class="list-item"><div class="lead"><div class="t">${esc(r.title)}</div><div class="tiny muted">${esc(r.course||'—')} · ${esc(r.type)}</div></div><button class="btn sm" onclick="openResource('${r.id}')">Open</button></div>`)}${block('Notices', not, n => `<div class="list-item" onclick="go('notices')" style="cursor:pointer"><div class="lead"><div class="t">${esc(n.title)}</div></div></div>`)}${block('Events', evs, e => `<div class="list-item" onclick="go('calendar')" style="cursor:pointer"><div class="dotc" style="background:${EVENT_COLORS[e.type]||'#888'}"></div><div class="lead"><div class="t">${esc(e.title)}</div><div class="tiny muted">${fmtDate(e.date)}</div></div></div>`)}${block('Forms', fms, f => `<div class="list-item" onclick="go('forms')" style="cursor:pointer"><div class="lead"><div class="t">${esc(f.title)}</div></div></div>`)}${block('Presentation Groups', pgs, g => `<div class="list-item" onclick="go('pgroups')" style="cursor:pointer"><div class="lead"><div class="t">${esc(g.name)}</div><div class="tiny muted">${esc(g.topic||'No topic')}</div></div></div>`)}${block('Groups', grs, g => `<a class="list-item" href="${esc(g.link)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div class="lead"><div class="t">${esc(g.name)}</div></div></a>`)}${block('Members', mem, m => `<div class="list-item"><div class="avatar" style="width:28px;height:28px;flex:0 0 28px;border-radius:8px;font-size:11px;background:${colorFor(m.id)}">${esc(initials(m.name))}</div><div class="lead"><div class="t">${esc(m.name)}</div><div class="tiny muted">${esc(m.student_id)} · ${esc(classLabel(m))}</div></div></div>`)}`;
}

  return '';
}

async function saveProfile(){
  const name = $('#pf_name').value.trim();
  const email = $('#pf_email').value.trim();
  const dept = ($('#pf_dept')?.value || '').trim().toUpperCase();
  const batch = ($('#pf_batch')?.value || '').trim();
  const section = ($('#pf_section')?.value || '').trim().toUpperCase();
  if (!name){ toast('Name required', 'err'); return; }
  const updates = { name, email };
  if (dept) updates.dept = dept;
  if (batch) updates.batch = batch;
  if (section) updates.section = section;
  if (isTeacher(S.profile)){
    const cleaned = extraSectionsDraft.filter(s => s.dept && s.batch && s.section).map(s => ({ dept:s.dept.toUpperCase(), batch:s.batch, section:s.section.toUpperCase() }));
    updates.extra_sections = cleaned;
  }
  const { error } = await sb.from('profiles').update(updates).eq('id', S.profile.id);
  if (error){ toast(error.message, 'err'); return; }
  Object.assign(S.profile, updates);
  await fetchAll(); toast('Profile updated'); closeModal(); render();
}

async function saveResource(id){
  const title = $('#r_title').value.trim();

    if (upErr){ toast('Upload failed: ' + upErr.message, 'err'); return; }

  let error;
  if (id){ if (filePath) { data.file_path = filePath; data.file_name = fileName; } ({ error } = await sb.from('resources').update(data).eq('id', id)); }
  else { ({ error } = await sb.from('resources').insert({ ...data, file_path: filePath, file_name: fileName, dept: (me.dept||'').toUpperCase(), batch: me.batch, section: (me.section||'').toUpperCase(), uploaded_by: me.id })); }
  if (error){ toast(error.message, 'err'); return; }
  toast(id ? 'Resource updated' : 'Resource uploaded'); closeModal();
}

async function syncToSheet(sub){
  const p = DB.presentations.find(x => x.id === sub.presentation_id) || {};
  const sectionCfg = DB.section_configs.find(c => c.dept !== '*' && sectionKey(c.dept, c.batch, c.section) === sectionKey(p.dept, p.batch, p.section));
  const adminCfg = DB.section_configs.find(c => c.dept === '*');
  const basePayload = { submissionId: sub.id, presentation: p.title || '', course: p.course || '', dept: (p.dept || '').toUpperCase(), batch: p.batch || '', section: (p.section || '').toUpperCase(), submittedAt: sub.submitted_at || new Date().toISOString(), status: sub.updated_at && sub.updated_at !== sub.submitted_at ? 'Updated' : 'Submitted', submitterId: (S.profile && S.profile.student_id) || '', link: sub.link, teamName: sub.team_name || '', leaderName: sub.leader_name, leaderId: sub.leader_id, members: sub.members || [] };
  let sent = false;
  if (sectionCfg?.webhook_url && !sectionCfg.webhook_url.includes('PASTE_')){
    try { await fetch(sectionCfg.webhook_url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ ...basePayload, token: sectionCfg.webhook_secret || '', scope: 'section' }), keepalive: true }); sent = true; } catch(e){}
  }
  if (adminCfg?.webhook_url && !adminCfg.webhook_url.includes('PASTE_')){
    try { await fetch(adminCfg.webhook_url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ ...basePayload, token: adminCfg.webhook_secret || '', scope: 'admin' }), keepalive: true }); sent = true; } catch(e){}
  }
  return sent;
}
async function submitPresentation(pid, existingId){
  const p = DB.presentations.find(x => x.id === pid);
  if (!p){ toast('Presentation not found', 'err'); return; }
  const link = (submissionDraft.link||'').trim();
  const teamName = (submissionDraft.teamName||'').trim();
  const leaderName = (submissionDraft.leaderName||'').trim();
  const leaderId = (submissionDraft.leaderId||'').trim();
  if (!link || !/^https?:\/\/\S+\.\S+/i.test(link)){ toast('Enter a valid URL', 'err'); return; }
  if (!leaderName || !leaderId){ toast('Leader name and ID required', 'err'); return; }
  const members = [];
  const seen = new Set([leaderId]);
  for (let i=0;i<memberDraft.length;i++){
    const nm = (memberDraft[i].name||'').trim();
    const mid = (memberDraft[i].id||'').trim();
    if (!nm && !mid) continue;
    if (!nm || !mid){ toast(`Member ${i+1}: both required`, 'err'); return; }
    if (seen.has(mid)){ toast(`Duplicate ID: ${mid}`, 'err'); return; }
    seen.add(mid); members.push({ name: nm, id: mid });
  }
  const max = p.max_team_size || 6;
  if (members.length + 1 > max){ toast(`Team size limit is ${max}`, 'err'); return; }
  const payload = { presentation_id: pid, link, team_name: teamName||null, leader_name: leaderName, leader_id: leaderId, members, submitted_by: S.profile.id, updated_at: new Date().toISOString() };
  let saved = null;
  if (existingId){ const { data, error } = await sb.from('submissions').update(payload).eq('id', existingId).select().single(); if (error){ toast(error.message, 'err'); return; } saved = data; toast('Submission updated'); }
  else { payload.submitted_at = new Date().toISOString(); const { data, error } = await sb.from('submissions').insert(payload).select().single(); if (error){ toast(error.message, 'err'); return; } saved = data; await notify(DB.profiles.filter(x=>x.role==='cr'||x.role==='admin').map(x=>x.id), 'New presentation submission', `${leaderName} submitted for "${p.title}".`, 'presentations'); toast('Submission saved'); }
  if (saved) syncToSheet(saved);
  memberDraft = []; submissionDraft = { link:'', teamName:'', leaderName:'', leaderId:'' }; closeModal();
}

/* =========================================================
   BOOT
   ========================================================= */
(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){ S.user = session.user; await loadProfile(); }
  S.loading = false;
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') return;
    if (session){ S.user = session.user; await loadProfile(); }
    else { S.user = null; S.profile = null; S.loading = false; render(); }
  });
  if (S.profile){ await fetchAll(); subscribeRealtime(); }
  render();
})();
async function loadProfile(){
  if (!S.user) return;
  for (let i=0; i<5; i++){
    const { data } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
    if (data){
      if (data.disabled){ await sb.auth.signOut(); toast('Your account has been removed by admin', 'err'); return; }
      const meta = S.user.user_metadata || {};
      const needsSync = (!data.dept || data.dept === 'CSE') && meta.dept && meta.dept !== 'CSE';
      if (needsSync){
        const patch = { dept: (meta.dept||'').toUpperCase(), batch: meta.batch || data.batch, section: (meta.section||'').toUpperCase() };
        await sb.from('profiles').update(patch).eq('id', S.user.id);
        Object.assign(data, patch);
      }
      S.profile = data;
      await fetchAll(); subscribeRealtime(); S.loading = false; render();
      return;
    }
    await new Promise(r => setTimeout(r, 500));
  }
  const meta = S.user.user_metadata || {};
  const { data, error } = await sb.from('profiles').insert({ id: S.user.id, name: meta.name || 'New User', student_id: meta.student_id || 'unknown_' + S.user.id.slice(0,8), email: S.user.email, dept: (meta.dept || 'CSE').toUpperCase(), batch: meta.batch || '—', section: (meta.section || '—').toUpperCase() }).select().maybeSingle();
  if (!error && data){ S.profile = data; await fetchAll(); subscribeRealtime(); }
  S.loading = false; render();
}
</script>
